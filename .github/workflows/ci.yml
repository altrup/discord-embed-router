name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Catches broken exports/types in the publishable artifact
      - run: pnpm dlx publint

  example:
    name: Example bot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The example consumes the package through its exports map,
      # so it only typechecks against a built dist
      - run: pnpm build

      - run: pnpm --filter basic-bot lint
      - run: pnpm --filter basic-bot format:check
      - run: pnpm --filter basic-bot typecheck
      - run: pnpm --filter basic-bot build
